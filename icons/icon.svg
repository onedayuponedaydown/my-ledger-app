<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#047857" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- Wallet / Ledger Icon -->
  <g transform="translate(96, 96)" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Book / Ledger Body -->
    <rect x="32" y="32" width="256" height="256" rx="36" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF"/>
    <!-- Bookmark / Ribbon -->
    <path d="M96 32v96l40-32 40 32V32" fill="#FBBF24" stroke="#FBBF24" stroke-width="16"/>
    <!-- Coin / Currency symbol in center -->
    <circle cx="160" cy="180" r="44" stroke="#FFFFFF" stroke-width="20"/>
    <path d="M160 156v48 M144 168h32 M144 188h32" stroke="#FFFFFF" stroke-width="16"/>
  </g>
</svg>
