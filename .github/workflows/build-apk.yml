name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Build Web Assets & Sync
        run: |
          npm run build

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyLedger-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publish Direct APK to GitHub Releases
        run: |
          gh release delete latest --yes || true
          git tag -d latest || true
          git push origin :latest || true
          gh release create latest android/app/build/outputs/apk/debug/app-debug.apk \
            --title "清爽记账 - 最新安卓安装包" \
            --notes "每次更新自动生成的最新 APK 安装包，手机端点击直接下载安装，无需解压。"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
